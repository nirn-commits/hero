<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--BUILD:HEAD-->
<title>超人列島クロニクル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&family=Bebas+Neue&display=swap">
<link rel="stylesheet" href="style.css">
<!--/BUILD:HEAD-->
</head>
<body>
<!--BUILD:BODY-->
<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1>超人列島<span>クロニクル</span></h1>
      <p class="seed">世界シード <b id="seedLabel">-</b><span id="saveLabel" class="saved"></span></p>
    </div>
    <div class="clock">
      <div id="dateLabel" class="date">----年--月--日</div>
      <div class="yearbar" aria-hidden="true"><i id="yearFill"></i></div>
      <div class="eralabel" id="eraLabel"></div>
    </div>
    <div class="controls" role="group" aria-label="進行速度">
      <button type="button" class="sp" data-sp="0" id="sp0" title="一時停止">❚❚</button>
      <button type="button" class="sp" data-sp="1" id="sp1" title="ゆっくり">▶</button>
      <button type="button" class="sp" data-sp="2" id="sp2" title="標準">▶▶</button>
      <button type="button" class="sp" data-sp="3" id="sp3" title="速い">▶▶▶</button>
      <button type="button" class="sp" data-sp="4" id="sp4" title="最速">⚡</button>
      <button type="button" class="ctl" id="skipBtn">年末まで</button>
      <button type="button" class="ctl" id="sizeBtn" title="文字の大きさ">文字 標準</button>
      <button type="button" class="ctl" id="newBtn">新しい世界</button>
    </div>
  </div>
  <div class="flash" id="flash">
    <div class="flash-in"><span class="flash-tag">速報</span><p id="flashText">まもなく新しい一年が始まります。</p></div>
  </div>
</header>

<nav class="tabs" role="tablist" aria-label="表示切り替え">
  <button type="button" class="tab only-narrow" data-tab="feed" id="tab-feed">ニュース</button>
  <button type="button" class="tab" data-tab="dash" id="tab-dash">概況</button>
  <button type="button" class="tab" data-tab="fav" id="tab-fav">★ 推し</button>
  <button type="button" class="tab" data-tab="rank" id="tab-rank">ランキング</button>
  <button type="button" class="tab" data-tab="records" id="tab-records">記録</button>
  <button type="button" class="tab" data-tab="roster" id="tab-roster">名鑑</button>
  <button type="button" class="tab" data-tab="villain" id="tab-villain">ヴィラン</button>
  <button type="button" class="tab" data-tab="org" id="tab-org">勢力図</button>
  <button type="button" class="tab" data-tab="school" id="tab-school">学園</button>
</nav>

<main class="layout">
  <section class="feedcol" id="feedCol" aria-label="ニュース">
    <div class="filters" id="filters"></div>
    <div id="feed" class="feed"></div>
  </section>
  <section class="side" id="side">
    <div class="pane" id="pane-dash"></div>
    <div class="pane" id="pane-fav" hidden></div>
    <div class="pane" id="pane-rank" hidden></div>
    <div class="pane" id="pane-records" hidden>
      <div class="tools">
        <div class="seg" id="recTypes" role="group" aria-label="記録の種類"></div>
      </div>
      <div class="tools">
        <select id="recYear" aria-label="年"></select>
      </div>
      <div id="recBody"></div>
    </div>
    <div class="pane" id="pane-roster" hidden>
      <div class="tools">
        <input id="rosterQ" type="search" placeholder="名前・能力・都道府県で検索" aria-label="ヒーローを検索">
        <select id="rosterSort" aria-label="並び順">
          <option value="rank">ランキング順</option>
          <option value="fame">人気順</option>
          <option value="captures">検挙数順</option>
          <option value="scandals">スキャンダル順</option>
          <option value="age">年齢順</option>
          <option value="debut">新しい順</option>
        </select>
        <select id="rosterStatus" aria-label="状態">
          <option value="live">現役のみ</option>
          <option value="all">すべて</option>
          <option value="gone">引退・殉職・闇堕ち</option>
        </select>
      </div>
      <div id="rosterList"></div>
    </div>
    <div class="pane" id="pane-villain" hidden>
      <div class="tools">
        <select id="vStatus" aria-label="ヴィランの状態">
          <option value="free">逃亡中</option>
          <option value="captured">収監中</option>
          <option value="kaiju">怪獣</option>
          <option value="all">すべて</option>
        </select>
      </div>
      <div id="villainList"></div>
    </div>
    <div class="pane" id="pane-org" hidden></div>
    <div class="pane" id="pane-school" hidden></div>
  </section>
</main>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="extra" id="extra" hidden></div>

<div class="modal" id="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button type="button" class="close" id="modalClose" aria-label="閉じる">×</button>
    <div id="modalBody"></div>
  </div>
</div>
<!--/BUILD:BODY-->

<!--BUILD:SCRIPTS-->
<script src="js/core.js"></script>
<script src="js/data_names.js"></script>
<script src="js/data_world.js"></script>
<script src="js/data_powers.js"></script>
<script src="js/data_people.js"></script>
<script src="js/data_events.js"></script>
<script src="js/data_story.js"></script>
<script src="js/data_more.js"></script>
<script src="js/data_more2.js"></script>
<script src="js/data_bond.js"></script>
<script src="js/data_voice.js"></script>
<script src="js/data_voice2.js"></script>
<script src="js/data_drama.js"></script>
<script src="js/data_school.js"></script>
<script src="js/generator.js"></script>
<script src="js/sim.js"></script>
<script src="js/story.js"></script>
<script src="js/bond.js"></script>
<script src="js/voice.js"></script>
<script src="js/drama.js"></script>
<script src="js/academy.js"></script>
<script src="js/ui.js"></script>
<!--/BUILD:SCRIPTS-->
</body>
</html>
